syntax = "proto3";

package core;

message Empty {}

// Scuttle birth metadata. An omitted ID has no established mailbox binding;
// callers must not infer ownership from control of its spending key alone.
message VtxoOwner {
	bytes vtxo_id = 1000;
	// Full compressed mailbox public key, including its parity.
	bytes owner_mailbox = 1001;
}

// An immutable source's winning fallback allocation. The wallet independently
// checks the transaction, BIP86 destination and canonical confirmations.
message FallbackClaim {
	// The allocated entitlement, which may differ from a wallet's original input.
	bytes vtxo_id = 1010;
	// Explicit stage-selected wallet sources/claim outputs, not inferred ancestry.
	repeated bytes source_vtxo_ids = 1011;
	uint64 allocation_id = 1000;
	bytes owner_mailbox = 1001;
	uint64 gross_sat = 1002;
	uint64 fee_sat = 1003;
	uint64 payout_sat = 1004;
	uint64 forfeited_sat = 1005;
	optional bytes transaction_id = 1006;
	optional uint32 output_index = 1007;
	optional uint32 confirmed_height = 1008;
	optional bytes confirmed_block_hash = 1009;
}

// Why a lightning send failed.
//
// Only FEE_TOO_LOW is worth retrying with a larger routing reserve: no route
// fit the budget, possibly after earlier attempts failed. The others cannot be
// helped by more money.
enum LightningFailureReason {
	// Zero value, so a message from a server that does not set the reason
	// decodes as unspecified rather than as a real reason.
	LIGHTNING_FAILURE_UNSPECIFIED = 0;
	LIGHTNING_FAILURE_FEE_TOO_LOW = 1;
	LIGHTNING_FAILURE_CLTV_TOO_LONG = 2;
	LIGHTNING_FAILURE_NO_ROUTE = 3;
	LIGHTNING_FAILURE_DESTINATION_REJECTED = 4;
	LIGHTNING_FAILURE_SETUP_TIMEOUT = 5;
	LIGHTNING_FAILURE_INVOICE_STATE = 6;
	LIGHTNING_FAILURE_OTHER = 7;
	LIGHTNING_FAILURE_RETRIES_EXHAUSTED = 8;
}

message LightningPaymentFailure {
	LightningFailureReason reason = 1;
}
